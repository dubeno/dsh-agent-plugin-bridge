- insert:
    - id: dsh-agent-plugin-bridge
      name: dsh-agent-plugin-bridge
      config:
        pluginRoots: []
        pluginsDirs:
          - '~/.cursor/plugins/local'
        mcpJsonPaths:
          - '~/.cursor/mcp.json'
        # Default off: plugin mcp.json usually relies on host env vars that
        # are not always set; the standalone ~/.cursor/mcp.json covers them.
        loadPluginMcp: false
        failOnMcpError: false
        skillProviderLabel: agent-plugin
